<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adaptive Task Planning Agent</title>
<style>
:root {
  --bg: #ffffff; --bg2: #f7f7f8; --line: #e5e5e5; --text: #1a1a1a;
  --muted: #8e8e93; --accent: #10a37f; --accent2: #0d8c6d;
  --green: #10a37f; --red: #ef4444; --amber: #f59e0b; --blue: #3b82f6;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { font-family: "Microsoft YaHei", system-ui, sans-serif; background: var(--bg);
       color: var(--text); }
button { font-family: inherit; }

@keyframes breath { 0%,100% { box-shadow: 0 0 0 0 rgba(16,163,127,.30); }
                    50% { box-shadow: 0 0 0 10px rgba(16,163,127,0); } }
@keyframes ping-blue { 0% { box-shadow: 0 0 0 0 rgba(59,130,246,.35); }
                       100% { box-shadow: 0 0 0 12px rgba(59,130,246,0); } }
@keyframes ping-amber { 0% { box-shadow: 0 0 0 0 rgba(245,158,11,.40); }
                        100% { box-shadow: 0 0 0 12px rgba(245,158,11,0); } }
@keyframes slidein { from { opacity: 0; transform: translateY(12px); }
                     to { opacity: 1; transform: none; } }
@keyframes dash { to { stroke-dashoffset: -28; } }

/* ═══ 布局骨架：上滚动区 + 底部输入区（对话式，不跳页） ═══ */
.app { display: flex; flex-direction: column; height: 100vh; max-width: 860px;
       margin: 0 auto; }
.chat-scroll { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
.composer { border-top: 1px solid var(--line); padding: 14px 18px 18px; background: var(--bg); }
.hint, .optline { color: var(--muted); font-size: 12.5px; }

/* ── 欢迎区（启动后淡出） ── */
#hero { margin: auto; text-align: center; padding: 40px 20px; animation: slidein .5s; }
#hero.off { display: none; }
.hello { font-size: 26px; font-weight: 600; margin-bottom: 8px; }
.hello-sub { color: var(--muted); font-size: 14.5px; margin-bottom: 20px; }
.pills { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.pill { border: 1px solid var(--line); border-radius: 18px; padding: 6px 14px;
        font-size: 12.5px; color: var(--muted); cursor: pointer; transition: .15s; }
.pill:hover { border-color: var(--accent); color: var(--accent); }
.pill.sel { background: #ecf8f4; border-color: var(--accent); color: var(--accent); }

/* ── 输入区 ── */
.inputwrap { border: 1px solid var(--line); border-radius: 24px; padding: 6px 6px 6px 18px;
             display: flex; align-items: flex-end; gap: 10px;
             box-shadow: 0 2px 12px rgba(0,0,0,.04); transition: border-color .2s; }
.inputwrap:focus-within { border-color: var(--accent); }
textarea { flex: 1; border: 0; outline: none; resize: none; font-size: 15px;
           font-family: inherit; max-height: 140px; min-height: 26px; line-height: 1.6;
           padding: 6px 0; background: transparent; }
.send { width: 38px; height: 38px; border-radius: 50%; border: 0; cursor: pointer;
        background: var(--accent); color: white; font-size: 16px; flex-shrink: 0; }
.send:disabled { background: var(--line); cursor: not-allowed; }
.optline { display: flex; gap: 14px; margin-top: 10px; align-items: center; }
.optline label { display: flex; gap: 5px; align-items: center; cursor: pointer; }

/* ═══ 运行区：管线图 + 详情 ═══ */
#runArea { padding: 26px 6px 10px; animation: slidein .4s; }
.card { background: var(--bg); border: 1px solid var(--line); border-radius: 16px;
        padding: 18px 20px; margin-bottom: 14px; }
.card h4 { font-size: 12px; color: var(--muted); font-weight: normal;
           letter-spacing: 1px; margin-bottom: 14px; }

/* ── 四阶段管线 ── */
.pipe { display: flex; align-items: flex-start; justify-content: space-between;
        position: relative; padding: 6px 8px 0; }
.pipe::before { content: ""; position: absolute; top: 27px; left: 9%; right: 9%;
                height: 2px; background: var(--line); }
.pnode { position: relative; z-index: 1; text-align: center; cursor: pointer;
         width: 22%; transition: .15s; }
.pnode .pdot { width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--line);
               background: var(--bg); margin: 0 auto 8px; display: flex;
               align-items: center; justify-content: center; font-size: 17px;
               color: var(--muted); transition: .25s; }
.pnode .pname { font-size: 13px; font-weight: 600; }
.pnode .pdesc { font-size: 11px; color: var(--muted); margin-top: 2px; }
.pnode .pcount { position: absolute; top: -4px; right: calc(50% - 34px);
                 background: var(--amber); color: white; border-radius: 10px;
                 font-size: 10.5px; padding: 1px 7px; opacity: 0; transition: .3s; }
.pnode.on .pcount, .pnode.done .pcount { opacity: 1; }
.pnode:hover .pdot { border-color: var(--accent); }
.pnode.cur .pdot { border-color: var(--accent); color: var(--accent);
                   animation: breath 1.7s infinite; }
.pnode.cur .pname { color: var(--accent); }
.pnode.done .pdot { background: var(--accent); border-color: var(--accent); color: white; }
.pnode.done .pname { color: var(--text); }
.pnode.flash-blue .pdot { animation: ping-blue 1s 1; border-color: var(--blue);
                          color: var(--blue); }
.pnode.flash-amber .pdot { animation: ping-amber 1.2s 1; border-color: var(--amber);
                           color: var(--amber); }
.pnode.sel .pdot { outline: 2px solid var(--accent); outline-offset: 3px; }

/* replan 回环虚线（SVG 叠加） */
.loopsvg { position: absolute; left: 10%; right: 10%; top: 0; height: 100%;
           pointer-events: none; z-index: 0; }
.loopsvg path { fill: none; stroke: var(--amber); stroke-width: 1.6;
                stroke-dasharray: 5 4; opacity: 0; transition: opacity .4s; }
.loopsvg.show path { opacity: .85; animation: dash 1.2s linear infinite; }

/* ── 详情面板 ── */
#detail { min-height: 80px; }
.drow { display: flex; gap: 10px; padding: 9px 12px; border-radius: 10px;
        background: var(--bg2); margin-bottom: 6px; font-size: 13px;
        animation: slidein .3s; }
.drow .k { color: var(--muted); flex-shrink: 0; width: 84px; font-size: 12px; }
.drow .v { flex: 1; word-break: break-all; }
.tag { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 10px;
       margin-right: 6px; }
.t-ok { background: #e7f6f0; color: var(--green); }
.t-no { background: #fdeaea; color: var(--red); }
.t-mut { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.empty { color: var(--muted); font-size: 13px; padding: 8px 4px; }

/* ── 审批卡 ── */
.hitl { border: 1.5px solid var(--amber); border-radius: 14px; padding: 16px 18px;
        margin-bottom: 14px; animation: slidein .35s; background: #fffdf5; }
.hitl .code { font-family: Consolas, monospace; background: var(--bg2);
              border-radius: 8px; padding: 10px 12px; margin: 10px 0; font-size: 12.5px; }
.hitl .btns { display: flex; gap: 10px; }
.hitl button { flex: 1; padding: 9px; border-radius: 10px; border: 0; cursor: pointer;
               font-size: 13px; }
.hitl .yes { background: var(--accent); color: white; }
.hitl .no { background: var(--bg); color: var(--text); border: 1px solid var(--line); }

/* ── 最终答案 ── */
.md p { margin: 0 0 10px; line-height: 1.75; }
.md h3, .md h2 { margin: 14px 0 8px; font-size: 15px; }
.md ul { margin: 0 0 10px 20px; }
.md li { margin-bottom: 4px; line-height: 1.6; }
.md a { color: var(--accent); }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }

.statrow { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px;
           margin: 4px 0 6px; }
.stat { background: var(--bg2); border-radius: 12px; padding: 12px 6px; text-align: center; }
.stat .n { font-size: 19px; font-weight: 600; }
.stat .l { font-size: 11px; color: var(--muted); margin-top: 4px; }
.donebtns { display: flex; gap: 10px; margin-top: 4px; }
.donebtns button { padding: 10px 22px; border-radius: 11px; border: 1px solid var(--line);
                   background: var(--bg); cursor: pointer; font-size: 13.5px; }
.donebtns .prime { background: var(--accent); color: white; border: 0; }
.hidden { display: none; }
</style>
</head>
<body>
<div class="app">
  <div class="chat-scroll" id="chatScroll">
    <div id="hero">
      <div class="hello">今天想做点什么？</div>
      <div class="hello-sub">描述一个复杂技术任务，我来拆解、执行、质检、动态调整</div>
      <div class="pills">
        <div class="pill sel" data-type="github_analysis">🐙 GitHub 项目分析</div>
        <div class="pill" data-type="learning_path">📖 技术学习规划</div>
        <div class="pill" data-type="problem_solving">🔧 问题诊断</div>
        <div class="pill" data-type="free">✏️ 自由任务</div>
      </div>
    </div>

    <div id="runArea" class="hidden">
      <!-- 用户目标气泡 -->
      <div class="card" style="background:#ecf8f4;border-color:#c9ede0">
        <b style="font-size:14px" id="goalEcho"></b>
        <span class="hint" id="modeEcho" style="margin-left:10px"></span>
      </div>

      <!-- 四阶段管线（可点击） -->
      <div class="card">
        <h4>执行管线 · 点击阶段查看详情</h4>
        <div class="pipe" id="pipe">
          <svg class="loopsvg" id="loopsvg" viewBox="0 0 100 60" preserveAspectRatio="none">
            <path d="M 72 30 C 72 58, 30 58, 30 32" marker-end=""/>
          </svg>
          <div class="pnode" data-stage="planner" id="pn-planner">
            <div class="pcount" style="background:var(--accent)"></div>
            <div class="pdot">🧭</div><div class="pname">Planner</div>
            <div class="pdesc">拆解目标</div></div>
          <div class="pnode" data-stage="executor" id="pn-executor">
            <div class="pcount"></div>
            <div class="pdot">⚙️</div><div class="pname">Executor</div>
            <div class="pdesc">工具执行</div></div>
          <div class="pnode" data-stage="evaluator" id="pn-evaluator">
            <div class="pcount"></div>
            <div class="pdot">🔍</div><div class="pname">Evaluator</div>
            <div class="pdesc">结果质检</div></div>
          <div class="pnode" data-stage="replanner" id="pn-replanner">
            <div class="pcount" id="replanCnt"></div>
            <div class="pdot">🔄</div><div class="pname">Replanner</div>
            <div class="pdesc">动态调整</div></div>
        </div>
      </div>

      <!-- 详情面板（随点击切换） -->
      <div class="card"><h4 id="detailTitle">详情</h4><div id="detail"></div></div>

      <div id="hitlWrap"></div>

      <div class="card hidden" id="finalCard">
        <h4>最终答案</h4>
        <div class="md" id="answer"></div>
        <div class="statrow" id="doneStats"></div>
        <div class="donebtns">
          <button class="prime" onclick="reset()">继续新任务</button>
          <button id="dlReport">下载运行报告</button>
        </div>
      </div>
    </div>
  </div>

  <div class="composer">
    <div class="inputwrap">
      <textarea id="goal" rows="1" placeholder="描述你的任务…（Ctrl+Enter 发送）"></textarea>
      <button class="send" id="start">↑</button>
    </div>
    <div class="optline">
      <label><input type="checkbox" id="adaptive" checked> 自适应重规划</label>
      <span>·</span><span>7 工具 · 断点恢复 · 高危审批 · 100 条评测集验证</span>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let runId = null, es = null, snap = {state: {}}, curStage = null;
let stageSeen = {planner: false, executor: false, evaluator: false, replanner: false};
let detailStage = "executor";

/* ── 胶囊/输入 ── */
document.querySelectorAll(".pill").forEach(p => p.onclick = () => {
  document.querySelectorAll(".pill").forEach(x => x.classList.remove("sel"));
  p.classList.add("sel");
});
const goal = $("goal");
goal.addEventListener("input", () => {
  goal.style.height = "auto";
  goal.style.height = Math.min(goal.scrollHeight, 140) + "px";
});
goal.addEventListener("keydown", e => { if (e.key === "Enter" && e.ctrlKey) $("start").click(); });

/* ── 启动（原地展开，不跳页） ── */
$("start").onclick = async () => {
  const g = goal.value.trim();
  if (!g) { goal.focus(); return; }
  $("start").disabled = true; goal.disabled = true;
  $("hero").classList.add("off");
  $("runArea").classList.remove("hidden");
  $("finalCard").classList.add("hidden");
  $("goalEcho").textContent = g;
  $("modeEcho").textContent = $("adaptive").checked ? "自适应模式" : "固定计划模式";
  stageSeen = {planner: false, executor: false, evaluator: false, replanner: false};
  setStage("planner", "cur");
  selectDetail("planner");

  const r = await fetch("/api/runs", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ goal: g, adaptive: $("adaptive").checked })
  }).then(x => x.json());
  runId = r.run_id;
  await refresh();

  es = new EventSource(`/api/runs/${runId}/events`);
  es.addEventListener("node_update", e => {
    const node = JSON.parse(e.data).node;
    if (node === "planner") { setStage("planner", "cur"); }
    if (node === "executor") {
      if (stageSeen.planner) setStage("planner", "done");
      setStage("executor", "cur"); flash("executor", "flash-blue");
    }
    if (node === "evaluator") { flash("evaluator", "flash-blue"); setStage("evaluator", "on"); }
    if (node === "replanner") {
      flash("replanner", "flash-amber");
      $("loopsvg").classList.add("show");
    }
    if (node === "final_answer") {
      ["planner", "executor", "evaluator"].forEach(s => setStage(s, "done"));
    }
    stageSeen[node] = true;
    refresh();
  });
  es.addEventListener("hitl_request", e => {
    const d = JSON.parse(e.data);
    $("hitlWrap").innerHTML = `
      <div class="hitl"><b>⛔ 高危操作等待审批</b>
        <div class="code">${(d.code || "(见任务描述)").replace(/</g, "&lt;")}</div>
        <div class="btns">
          <button class="yes" onclick="decide(true)">✅ 批准执行</button>
          <button class="no" onclick="decide(false)">🚫 拒绝</button>
        </div></div>`;
    $("hitlWrap").scrollIntoView({ behavior: "smooth", block: "end" });
  });
  es.addEventListener("hitl_resolved", e => {
    const ok = JSON.parse(e.data).approved;
    $("hitlWrap").innerHTML = "";
    renderDetail();
  });
  es.addEventListener("final", e => { es.close(); finish(JSON.parse(e.data)); });
  es.addEventListener("error", e => refresh());
};

function setStage(s, cls) {
  const el = $("pn-" + s);
  el.classList.remove("cur");
  if (cls === "done") el.classList.add("done");
  if (cls === "cur") { el.classList.add("cur"); el.classList.remove("done"); }
}
function flash(s, cls) {
  const el = $("pn-" + s);
  el.classList.remove(cls); void el.offsetWidth;      // 重置动画
  el.classList.add(cls);
}

/* ── 快照拉取 ── */
async function refresh() {
  if (!runId) return;
  const r = await fetch(`/api/runs/${runId}`);
  if (!r.ok) return;
  const data = await r.json();
  snap = data;
  const st = data.state || {};
  if (st.replan_count) {
    $("replanCnt").textContent = st.replan_count;
    $("pn-replanner").classList.add("on");
    $("loopsvg").classList.add("show");
  }
  renderDetail();
}

/* ── 详情面板：四阶段各看各的 ── */
document.querySelectorAll(".pnode").forEach(n => n.onclick = () =>
  selectDetail(n.dataset.stage));
function selectDetail(s) {
  detailStage = s;
  document.querySelectorAll(".pnode").forEach(x =>
    x.classList.toggle("sel", x.dataset.stage === s));
  renderDetail();
}
function renderDetail() {
  const st = snap.state || {};
  const titles = {planner: "Planner · 任务规划", executor: "Executor · 工具执行",
                  evaluator: "Evaluator · 质检判定", replanner: "Replanner · 动态调整"};
  $("detailTitle").textContent = titles[detailStage];
  const D = $("detail");
  D.innerHTML = "";

  if (detailStage === "planner") {
    const plan = st.plan || [];
    if (!plan.length) { D.innerHTML = `<div class="empty">正在拆解目标…</div>`; return; }
    plan.forEach(t => {
      const ok = t.status === "completed", bad = t.status === "failed";
      D.innerHTML += `<div class="drow"><span class="k">${t.id}</span>
        <span class="v"><span class="tag ${ok ? "t-ok" : bad ? "t-no" : "t-mut"}">
        ${ok ? "完成" : bad ? "失败" : "待执行"}</span>${t.description}
        <span style="color:var(--muted)">（${t.tool || "-"}）</span></span></div>`;
    });
  }

  if (detailStage === "executor") {
    const obs = st.observations || [];
    if (!obs.length) { D.innerHTML = `<div class="empty">尚无工具调用</div>`; return; }
    obs.slice().reverse().forEach(o => {
      D.innerHTML += `<div class="drow"><span class="k">${o.task_id}</span>
        <span class="v"><span class="tag ${o.success ? "t-ok" : "t-no"}">${o.tool}
        ${o.success ? "√" : "✕"}</span>
        ${o.success ? (o.summary || "").slice(0, 160).replace(/</g, "&lt;") + "…"
                    : `<span style="color:var(--red)">${(o.error || "").replace(/</g, "&lt;")}</span>`}
        <span style="color:var(--muted);font-size:11px"> · ${o.latency_ms}ms</span></span></div>`;
    });
  }

  if (detailStage === "evaluator") {
    const ev = st.evaluation;
    if (!ev) { D.innerHTML = `<div class="empty">暂无质检判定</div>`; return; }
    D.innerHTML = `<div class="drow"><span class="k">判定</span>
      <span class="v"><span class="tag ${ev.success ? "t-ok" : "t-no"}">
      ${ev.success ? "意图达成" : "未达成"}</span>${(ev.reason || "").replace(/</g, "&lt;")}</span></div>
      ${ev.need_replan ? `<div class="drow"><span class="k">信息缺口</span>
      <span class="v">${(ev.missing_info || "需要补充信息").replace(/</g, "&lt;")}</span></div>` : ""}`;
  }

  if (detailStage === "replanner") {
    const n = st.replan_count || 0;
    if (!n) { D.innerHTML = `<div class="empty">本次运行未触发动态调整${$("adaptive").checked ? "" : "（固定计划模式）"}</div>`; return; }
    D.innerHTML = `<div class="drow"><span class="k">调整次数</span>
      <span class="v">已重规划 <b>${n}</b> 次（上限 3 次，熔断保护）</span></div>
      <div class="drow"><span class="k">当前计划</span>
      <span class="v">${(st.plan || []).length} 个任务，新任务已合并进队列——
      点击 Planner 阶段查看最新计划</span></div>`;
  }
}

/* ── 结束 ── */
function finish(answer) {
  ["planner", "executor", "evaluator"].forEach(s => setStage(s, "done"));
  const st = snap.state || {};
  const obs = st.observations || [];
  const okN = obs.filter(o => o.success).length;
  const plan = st.plan || [];
  const doneN = plan.filter(t => t.status === "completed").length;
  $("answer").innerHTML = mdRender(answer || "(无最终答案)");
  $("doneStats").innerHTML = [
    [obs.length, "工具调用"], [okN, "调用成功"], [plan.length, "计划任务"],
    [st.replan_count || 0, "动态调整"],
    [plan.length ? Math.round(doneN / plan.length * 100) + "%" : "-", "完成度"]
  ].map(([n, l]) => `<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`).join("");
  $("finalCard").classList.remove("hidden");
  $("finalCard").scrollIntoView({ behavior: "smooth" });
  $("start").disabled = false; goal.disabled = false;
}

/* ── 轻量 Markdown 渲染（修 \n 问题 + 基础排版） ── */
function mdRender(text) {
  const esc = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const lines = esc.split(/\r?\n/);
  let html = "", inList = false;
  for (const ln of lines) {
    const t = ln.trim();
    if (/^[-*]\s+/.test(t)) {
      if (!inList) { html += "<ul>"; inList = true; }
      html += "<li>" + inline(t.replace(/^[-*]\s+/, "")) + "</li>";
    } else {
      if (inList) { html += "</ul>"; inList = false; }
      if (/^#{1,4}\s+/.test(t)) html += `<h3>${inline(t.replace(/^#{1,4}\s+/, ""))}</h3>`;
      else if (/^---+$/.test(t)) html += "<hr>";
      else if (t === "") html += "";
      else html += `<p>${inline(t)}</p>`;
    }
  }
  if (inList) html += "</ul>";
  return html;
  function inline(s) {
    return s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
            .replace(/(https?:\/\/[^\s<)]+)/g, '<a href="$1" target="_blank">$1</a>');
  }
}

/* ── 审批 / 报告 / 重置 ── */
function decide(approved) {
  fetch(`/api/runs/${runId}/approvals`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ approved })
  });
}
$("dlReport").onclick = () => {
  fetch(`/api/runs/${runId}`).then(r => r.json()).then(s => {
    const blob = new Blob([JSON.stringify(s, null, 1)], {type: "application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `report-${runId}.json`;
    a.click();
  });
};
function reset() {
  $("runArea").classList.add("hidden");
  $("hero").classList.remove("off");
  goal.value = ""; goal.style.height = "auto"; goal.focus();
  document.querySelectorAll(".pnode").forEach(n =>
    n.className = "pnode" + (n.dataset.stage === "planner" ? " cur" : ""));
  $("loopsvg").classList.remove("show");
  $("hitlWrap").innerHTML = "";
}
</script>
</body>
