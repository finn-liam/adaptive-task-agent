<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adaptive Task Planning Agent</title>
<style>
:root {
  --bg: #ffffff; --bg2: #f7f7f8; --line: #e5e5e5; --text: #1a1a1a;
  --muted: #8e8e93; --accent: #10a37f; --accent2: #0d8c6d;
  --green: #10a37f; --red: #ef4444; --amber: #f59e0b;
}
* { box-sizing: border-box; margin: 0; }
body { font-family: "Microsoft YaHei", system-ui, sans-serif; background: var(--bg);
       color: var(--text); }

/* ═══ 通用 ═══ */
.view { display: none; min-height: 100vh; }
.view.on { display: flex; flex-direction: column; }
.hidden { display: none; }
button { font-family: inherit; }
spin = x;
.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes breath { 0%,100% { box-shadow: 0 0 0 0 rgba(16,163,127,.35); }
                    50% { box-shadow: 0 0 0 9px rgba(16,163,127,0); } }
@keyframes slidein { from { opacity: 0; transform: translateY(14px); }
                     to { opacity: 1; transform: none; } }
@keyframes flow { from { stroke-dashoffset: 24; } to { stroke-dashoffset: 0; } }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

/* ═══ 视图一：ChatGPT 式开始页 ═══ */
#v-start { align-items: center; justify-content: center; padding: 40px 20px; }
.hello { font-size: 28px; font-weight: 600; margin-bottom: 10px; animation: fadein .5s; }
.hello-sub { color: var(--muted); font-size: 15px; margin-bottom: 34px; animation: fadein .6s; }
.startbox { width: min(680px, 92vw); }
.inputwrap { border: 1px solid var(--line); border-radius: 26px; padding: 8px 8px 8px 20px;
             display: flex; align-items: flex-end; gap: 10px; background: var(--bg);
             box-shadow: 0 2px 14px rgba(0,0,0,.04); transition: border-color .2s; }
.inputwrap:focus-within { border-color: var(--accent); }
textarea { flex: 1; border: 0; outline: none; resize: none; font-size: 15px;
           font-family: inherit; max-height: 160px; min-height: 28px; line-height: 1.6;
           padding: 6px 0; background: transparent; color: var(--text); }
.send { width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer;
        background: var(--accent); color: white; font-size: 17px; flex-shrink: 0;
        display: flex; align-items: center; justify-content: center; transition: .15s; }
.send:hover { background: var(--accent2); }
.send:disabled { background: var(--line); cursor: not-allowed; }
.pills { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; justify-content: center; }
.pill { border: 1px solid var(--line); border-radius: 18px; padding: 7px 16px;
        font-size: 13px; color: var(--muted); cursor: pointer; background: var(--bg);
        transition: .15s; }
.pill:hover { border-color: var(--accent); color: var(--accent); }
.pill.sel { background: #ecf8f4; border-color: var(--accent); color: var(--accent); }
.hint { margin-top: 26px; color: var(--muted); font-size: 12.5px; text-align: center; }
.optline { display: flex; gap: 16px; justify-content: center; margin-top: 12px;
           font-size: 13px; color: var(--muted); align-items: center; }
.optline label { display: flex; gap: 5px; align-items: center; cursor: pointer; }

/* ═══ 视图二：动态规划运行页 ═══ */
#v-run { padding: 0; }
.topbar { display: flex; align-items: center; gap: 14px; padding: 14px 26px;
          border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg);
          z-index: 5; }
.topbar .goal-snip { flex: 1; font-size: 14px; color: var(--muted);
                     white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prog { width: 180px; height: 6px; border-radius: 6px; background: var(--bg2); overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: var(--accent);
          border-radius: 6px; transition: width .6s cubic-bezier(.4,0,.2,1); }
.dotlive { width: 9px; height: 9px; border-radius: 50%; background: var(--green);
           animation: breath 1.6s infinite; flex-shrink: 0; }

.rungrid { display: grid; grid-template-columns: 380px 1fr; gap: 0; flex: 1; min-height: 0; }
@media (max-width: 860px) { .rungrid { grid-template-columns: 1fr; } }

/* 左：计划链 */
.planpane { border-right: 1px solid var(--line); padding: 24px 22px; overflow-y: auto;
            background: var(--bg); }
.planpane h4 { font-size: 12px; color: var(--muted); font-weight: normal;
               letter-spacing: 1px; margin-bottom: 16px; display: flex; gap: 8px;
               align-items: center; }
.tlist { position: relative; }
.tnode { display: flex; gap: 12px; position: relative; padding-bottom: 26px;
         animation: slidein .4s; }
.tnode::before { content: ""; position: absolute; left: 13px; top: 28px; bottom: 0;
                 width: 2px; background: var(--line); }
.tnode:last-child::before { display: none; }
.tnode.done::before { background: var(--accent); }
.tico { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line);
        background: var(--bg); display: flex; align-items: center; justify-content: center;
        font-size: 12px; color: var(--muted); flex-shrink: 0; z-index: 1; }
.tnode.run .tico { border-color: var(--accent); color: var(--accent); animation: breath 1.6s infinite; }
.tnode.done .tico { background: var(--accent); border-color: var(--accent); color: white; }
.tnode.fail .tico { border-color: var(--red); color: var(--red); }
.tbody { padding-top: 3px; }
.ttitle { font-size: 13.5px; line-height: 1.45; }
.tmeta { font-size: 11.5px; color: var(--muted); margin-top: 3px; display: flex; gap: 8px; }
.tmeta .st-done { color: var(--green); } .tmeta .st-fail { color: var(--red); }
.tnode.new { outline: 1px dashed var(--amber); outline-offset: 4px; border-radius: 6px; }

/* 右：日志与事件 */
.logpane { padding: 24px 28px; overflow-y: auto; background: var(--bg2); }
.logpane h4 { font-size: 12px; color: var(--muted); font-weight: normal;
              letter-spacing: 1px; margin-bottom: 14px; }
.evline { display: flex; gap: 12px; padding: 9px 14px; border-radius: 10px;
          background: var(--bg); margin-bottom: 8px; font-size: 13px;
          animation: slidein .35s; border: 1px solid transparent; }
.evline .ts { color: var(--muted); font-family: Consolas, monospace; font-size: 11.5px;
              padding-top: 2px; flex-shrink: 0; }
.evline.err { border-color: #fecaca; background: #fef2f2; }
.evline.hi { border-color: #fde68a; background: #fffbeb; }
.evline.ok { border-color: #bbf7d0; }
.evalcard { margin: 14px 0; padding: 12px 16px; border-radius: 12px; background: var(--bg);
            border: 1px solid var(--line); font-size: 13px; animation: slidein .4s; }
.evalcard b { font-size: 12px; color: var(--muted); font-weight: normal;
              display: block; margin-bottom: 6px; letter-spacing: 1px; }

/* HITL 审批 */
.hitl { margin: 6px 0 14px; padding: 16px 18px; border-radius: 14px; background: var(--bg);
        border: 1.5px solid var(--amber); animation: slidein .4s; }
.hitl .code { font-family: Consolas, monospace; background: var(--bg2); border-radius: 8px;
              padding: 10px 12px; margin: 10px 0; font-size: 12.5px; }
.hitl .btns { display: flex; gap: 10px; }
.hitl button { flex: 1; padding: 10px; border-radius: 10px; border: 0; cursor: pointer;
               font-size: 13.5px; }
.hitl .yes { background: var(--accent); color: white; }
.hitl .no { background: var(--bg2); color: var(--text); border: 1px solid var(--line); }

/* ═══ 视图三：结束页 ═══ */
#v-done { align-items: center; padding: 60px 24px; }
.donecard { width: min(760px, 94vw); animation: slidein .5s; }
.donehead { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
.donehead .big { font-size: 22px; font-weight: 600; }
.donehead .emo { font-size: 30px; }
.donesub { color: var(--muted); font-size: 14px; margin-bottom: 22px; }
.statrow { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 20px; }
.stat { background: var(--bg2); border-radius: 14px; padding: 16px 8px; text-align: center; }
.stat .n { font-size: 22px; font-weight: 600; }
.stat .l { font-size: 11.5px; color: var(--muted); margin-top: 5px; }
.answer { background: var(--bg2); border-radius: 16px; padding: 24px 26px;
          white-space: pre-wrap; line-height: 1.8; font-size: 14px; }
.answer h5 { font-size: 12px; color: var(--muted); font-weight: normal; margin-bottom: 10px;
             letter-spacing: 1px; }
.donebtns { display: flex; gap: 12px; margin-top: 22px; }
.donebtns button { padding: 12px 26px; border-radius: 12px; border: 1px solid var(--line);
                   background: var(--bg); cursor: pointer; font-size: 14px; }
.donebtns .prime { background: var(--accent); color: white; border: 0; }
</style>
</head>
<body>

<!-- ═══ 视图一：开始（ChatGPT 式） ═══ -->
<div class="view on" id="v-start">
  <div class="hello">今天想做点什么？</div>
  <div class="hello-sub">描述一个复杂技术任务，我会拆解计划、调用工具、动态调整并交付结果</div>
  <div class="startbox">
    <div class="inputwrap">
      <textarea id="goal" rows="1" placeholder="例如：分析 langchain-ai/langgraph 仓库，并制定学习路线…"></textarea>
      <button class="send" id="start" title="开始（Ctrl+Enter）">↑</button>
    </div>
    <div class="pills">
      <div class="pill sel" data-type="github_analysis">🐙 GitHub 项目分析</div>
      <div class="pill" data-type="learning_path">📖 技术学习规划</div>
      <div class="pill" data-type="problem_solving">🔧 问题诊断</div>
      <div class="pill" data-type="free">✏️ 自由任务</div>
    </div>
    <div class="optline">
      <label><input type="checkbox" id="adaptive" checked> 自适应重规划</label>
      <span style="color:#c9c9cf">·</span>
      <span>运行中断后可凭 run_id 续跑</span>
    </div>
    <div class="hint">7 个工具 · 断点恢复 · 高危操作人工审批 · 100 条评测集实验验证</div>
  </div>
</div>

<!-- ═══ 视图二：运行中（动态规划） ═══ -->
<div class="view" id="v-run">
  <div class="topbar">
    <div class="dotlive"></div>
    <div class="goal-snip" id="goalSnip"></div>
    <div class="prog"><i id="progBar"></i></div>
    <span style="font-size:12.5px;color:var(--muted)" id="progTxt">0%</span>
  </div>
  <div class="rungrid">
    <div class="planpane">
      <h4><span class="spin" style="display:inline-block">⚙</span> 执行计划<span id="replanBadge" style="color:var(--amber)"></span></h4>
      <div class="tlist" id="plan"></div>
    </div>
    <div class="logpane">
      <h4>实时动态</h4>
      <div id="rlog"></div>
      <div id="hitlWrap"></div>
    </div>
  </div>
</div>

<!-- ═══ 视图三：结束 ═══ -->
<div class="view" id="v-done">
  <div class="donecard">
    <div class="donehead"><span class="emo" id="doneEmo">✅</span>
      <span class="big" id="doneTitle">任务完成</span></div>
    <div class="donesub" id="doneSub"></div>
    <div class="statrow" id="doneStats"></div>
    <div class="answer"><h5>最终答案</h5><div id="answer"></div></div>
    <div class="donebtns">
      <button class="prime" onclick="showStart()">继续新任务</button>
      <button id="dlReport">下载运行报告</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let runId = null, es = null, seenIds = new Set(), evCount = 0;

/* ── 视图切换 ── */
function show(id) {
  document.querySelectorAll(".view").forEach(v => v.classList.remove("on"));
  $(id).classList.add("on");
}
function showStart() { show("v-start"); $("goal").focus(); }

/* ── 开始页交互 ── */
document.querySelectorAll(".pill").forEach(p => p.onclick = () => {
  document.querySelectorAll(".pill").forEach(x => x.classList.remove("sel"));
  p.classList.add("sel");
});
const goal = $("goal");
goal.addEventListener("input", () => {
  goal.style.height = "auto";
  goal.style.height = Math.min(goal.scrollHeight, 160) + "px";
});
goal.addEventListener("keydown", e => { if (e.key === "Enter" && e.ctrlKey) $("start").click(); });

/* ── 启动 ── */
$("start").onclick = async () => {
  const g = goal.value.trim();
  if (!g) { goal.focus(); return; }
  $("start").disabled = true;
  show("v-run");
  $("goalSnip").textContent = g;
  $("replanBadge").textContent = "";
  evCount = 0;
  const r = await fetch("/api/runs", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ goal: g, adaptive: $("adaptive").checked })
  }).then(x => x.json());
  runId = r.run_id;
  ev(`🚀 运行已创建（run_id: <b>${runId}</b>）`);

  es = new EventSource(`/api/runs/${runId}/events`);
  es.addEventListener("node_update", e => {
    const node = JSON.parse(e.data).node;
    evCount++;
    if (node === "planner") ev("🧭 Planner 正在拆解目标…");
    if (node === "executor") ev("⚙️ Executor 执行任务");
    if (node === "evaluator") ev("🔍 Evaluator 质检结果");
    if (node === "replanner") ev(`🔄 <b>Replanner 动态调整计划</b>`, "hi");
    if (node === "human_gate") ev("⛔ 进入人工审批闸口", "hi");
    if (node === "final_answer") ev("📝 正在汇总最终答案…");
    refresh();
  });
  es.addEventListener("hitl_request", e => {
    const d = JSON.parse(e.data);
    $("hitlWrap").innerHTML = `
      <div class="hitl">
        <b>⛔ 高危操作等待审批</b>
        <div class="code">${(d.code || "(见任务描述)").replace(/</g, "&lt;")}</div>
        <div class="btns">
          <button class="yes" onclick="decide(true)">✅ 批准执行</button>
          <button class="no" onclick="decide(false)">🚫 拒绝</button>
        </div>
      </div>`;
    $("hitlWrap").scrollIntoView({ behavior: "smooth", block: "end" });
  });
  es.addEventListener("hitl_resolved", e => {
    const ok = JSON.parse(e.data).approved;
    $("hitlWrap").innerHTML = "";
    ev(ok ? "✅ 审批通过，工具继续执行" : "🚫 用户拒绝，任务标记失败（人的否决是终审）", ok ? "ok" : "err");
  });
  es.addEventListener("final", e => { es.close(); finish(e.data); });
  es.addEventListener("error", e => ev("❌ " + (e.data || "连接中断"), "err"));
};

function ev(html, cls = "") {
  const ts = new Date().toLocaleTimeString("zh", { hour12: false });
  const div = document.createElement("div");
  div.className = "evline " + cls;
  div.innerHTML = `<span class="ts">${ts}</span><span>${html}</span>`;
  $("rlog").appendChild(div);
  div.scrollIntoView({ behavior: "smooth", block: "end" });
}

/* ── 计划链渲染（新任务滑入 + 状态流转） ── */
async function refresh() {
  const r = await fetch(`/api/runs/${runId}`);
  if (!r.ok) return;
  const { state } = await r.json();
  const plan = state.plan || [];
  const cur = state.current_task || 0;
  const doneN = plan.filter(t => t.status === "completed").length;
  const pct = plan.length ? Math.min(100, Math.round(
    (doneN + (plan.length > doneN ? 0.5 : 0)) / plan.length * 100)) : 0;
  $("progBar").style.width = pct + "%";
  $("progTxt").textContent = pct + "%";
  $("replanBadge").textContent = state.replan_count
    ? `（已调整 ${state.replan_count} 次）` : "";

  $("plan").innerHTML = plan.map((t, i) => {
    const isNew = !seenIds.has(t.id) && seenIds.size > 0;   // replan 插入的新节点
    const cls = t.status === "completed" ? "done"
      : t.status === "failed" ? "fail"
      : i === cur - 0 && t.status === "running" ? "run" : "";
    const ico = t.status === "completed" ? "✓"
      : t.status === "failed" ? "✕" : i + 1;
    const st = t.status === "completed" ? '<span class="st-done">已完成</span>'
      : t.status === "failed" ? '<span class="st-fail">已失败</span>'
      : t.status === "running" ? "执行中…" : "待执行";
    return `<div class="tnode ${cls} ${isNew ? "new" : ""}">
      <div class="tico">${ico}</div>
      <div class="tbody"><div class="ttitle">${t.description}</div>
      <div class="tmeta"><span>${t.tool || "-"}</span>${st}</div></div></div>`;
  }).join("");
  plan.forEach(t => seenIds.add(t.id));
}

/* ── 结束 ── */
function finish(answer) {
  fetch(`/api/runs/${runId}`).then(r => r.json()).then(({ status, state }) => {
    const obs = state.observations || [];
    const ok = obs.filter(o => o.success).length;
    const plan = state.plan || [];
    const doneN = plan.filter(t => t.status === "completed").length;
    const allDone = status === "done" && doneN === plan.length;
    $("doneEmo").textContent = allDone ? "🎉" : "🧩";
    $("doneTitle").textContent = allDone ? "任务完成" : "任务结束（部分未完成）";
    $("doneSub").textContent = `run_id ${runId} · 共 ${obs.length} 次工具调用`
      + (state.replan_count ? ` · 动态调整 ${state.replan_count} 次` : "");
    $("doneStats").innerHTML = [
      [obs.length, "工具调用"], [ok, "调用成功"], [plan.length, "计划任务"],
      [state.replan_count || 0, "动态调整"],
      [plan.length ? Math.round(doneN / plan.length * 100) + "%" : "-", "完成度"]
    ].map(([n, l]) => `<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`).join("");
    $("answer").textContent = answer || "(无最终答案)";
    show("v-done");
    $("start").disabled = false;
  });
}

$("dlReport").onclick = () => {
  fetch(`/api/runs/${runId}`).then(r => r.json()).then(snap => {
    const blob = new Blob([JSON.stringify(snap, null, 1)], {type: "application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `report-${runId}.json`;
    a.click();
  });
};

function decide(approved) {
  fetch(`/api/runs/${runId}/approvals`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ approved })
  });
}

showStart();
</script>
</body>
</html>
