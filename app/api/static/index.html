<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adaptive Task Planning Agent</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", system-ui, sans-serif; margin: 0;
         background: #0f1420; color: #dfe6f0; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 20px; }
  .row { display: flex; gap: 8px; margin: 12px 0; }
  input[type=text] { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #2a3550;
                     background: #161d2e; color: #dfe6f0; }
  button { padding: 10px 18px; border: 0; border-radius: 8px; cursor: pointer;
           background: #3b6ef5; color: white; }
  button.ghost { background: #2a3550; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .panel { background: #161d2e; border: 1px solid #2a3550; border-radius: 10px;
           padding: 14px 16px; margin-top: 14px; }
  .panel h3 { margin: 0 0 8px; font-size: 14px; color: #8fa3c8; }
  .task { padding: 4px 0; font-size: 14px; }
  .done { color: #6fe08a; } .failed { color: #ff7b7b; } .run { color: #ffd166; }
  .log { font-family: Consolas, monospace; font-size: 12.5px; white-space: pre-wrap;
         color: #9fb2d0; max-height: 260px; overflow-y: auto; }
  .hitl { border-color: #ffd166; background: #2a2413; }
  .answer { white-space: pre-wrap; line-height: 1.7; }
  .hidden { display: none; }
  label.check { font-size: 13px; color: #8fa3c8; align-self: center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🤖 Adaptive Task Planning Agent</h1>

  <div class="row">
    <input type="text" id="goal" placeholder="输入复杂技术任务，如：分析 langchain-ai/langgraph 仓库并找中文教程">
    <label class="check"><input type="checkbox" id="adaptive" checked> 自适应重规划</label>
    <button id="start">启动</button>
  </div>

  <div class="panel" id="statusPanel">状态：待命</div>

  <div class="panel hidden" id="planPanel"><h3>任务清单</h3><div id="plan"></div></div>

  <div class="panel hidden" id="hitlPanel">
    <h3>⛔ 高危操作等待审批</h3>
    <div id="hitlInfo" class="log"></div>
    <div class="row">
      <button id="approve">✅ 批准执行</button>
      <button class="ghost" id="reject">🚫 拒绝</button>
    </div>
  </div>

  <div class="panel hidden" id="logPanel"><h3>执行流水</h3><div id="log" class="log"></div></div>

  <div class="panel hidden" id="answerPanel"><h3>最终答案</h3><div id="answer" class="answer"></div></div>
</div>

<script>
const $ = id => document.getElementById(id);
let runId = null, es = null;

function log(line) {
  $("logPanel").classList.remove("hidden");
  $("log").textContent += line + "\n";
  $("log").scrollTop = $("log").scrollHeight;
}

async function refreshSnapshot() {          // 拉最新白板：刷新任务清单与流水状态
  const r = await fetch(`/api/runs/${runId}`);
  if (!r.ok) return;
  const { status, state } = await r.json();
  if (state.plan) {
    $("planPanel").classList.remove("hidden");
    $("plan").innerHTML = state.plan.map(t =>
      `<div class="task ${t.status}">[${t.status}] ${t.id} · ${t.tool || "-"}｜${t.description}</div>`
    ).join("");
  }
  if (state.observations) {
    $("logPanel").classList.remove("hidden");
    $("log").textContent = state.observations.map(o =>
      `${o.success ? "√" : "X"} [${o.task_id}] ${o.tool}：${o.error || (o.summary || "").slice(0, 80)}`
    ).join("\n");
  }
  $("statusPanel").textContent = "状态：" + status;
}

function start() {
  const goal = $("goal").value.trim();
  if (!goal) return alert("先输入目标");
  $("start").disabled = true;
  ["planPanel", "answerPanel"].forEach(p => $(p).classList.add("hidden"));
  $("plan").innerHTML = ""; $("log").textContent = ""; $("answer").textContent = "";

  fetch("/api/runs", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ goal, adaptive: $("adaptive").checked })
  }).then(r => r.json()).then(({ run_id }) => {
    runId = run_id;
    log("🚀 已启动 run_id = " + run_id);
    es = new EventSource(`/api/runs/${run_id}/events`);
    es.addEventListener("node_update", e => refreshSnapshot());
    es.addEventListener("hitl_request", e => {
      const d = JSON.parse(e.data);
      $("hitlPanel").classList.remove("hidden");
      $("hitlInfo").textContent = `任务 ${d.task_id} 请求执行 execute_python，代码：${d.code || "(见任务描述)"}`;
    });
    es.addEventListener("hitl_resolved", () => $("hitlPanel").classList.add("hidden"));
    es.addEventListener("final", e => {
      $("answerPanel").classList.remove("hidden");
      $("answer").textContent = e.data;
      refreshSnapshot();
      es.close(); $("start").disabled = false;
    });
    es.addEventListener("error", e => {
      log("❌ " + (e.data || "连接中断")); refreshSnapshot();
    });
  });
}

function decide(approved) {
  fetch(`/api/runs/${runId}/approvals`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ approved })
  });
}

$("start").onclick = start;
$("approve").onclick = () => decide(true);
$("reject").onclick = () => decide(false);
</script>
</body>
</html>
