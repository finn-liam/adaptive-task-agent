<!DOCTYPE html>
<html lang="zh" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adaptive Task Planning Agent</title>
<style>
:root {
  --bg: #FAFAFB; --card: #FFFFFF; --line: #ECECEF; --line2: #E0E0E4;
  --text: #17171C; --muted: #8A8A93; --faint: #B4B4BC;
  --accent: #4F46E5; --accent-soft: #EEF0FE;
  --green: #16A34A; --green-soft: #EBF7EF;
  --red: #DC2626; --red-soft: #FDEEEE;
  --amber: #C77E0A; --amber-soft: #FBF3E3;
  --code-bg: #101116; --code-tx: #CFD6E4;
  --side: #FFFFFF;
}
html[data-theme="dark"] {
  --bg: #0E0F13; --card: #16171D; --line: #24252D; --line2: #2E2F39;
  --text: #E8E9ED; --muted: #7E7F8A; --faint: #55565F;
  --accent: #818CF8; --accent-soft: #1E2140;
  --green: #4ADE80; --green-soft: #14251B;
  --red: #F87171; --red-soft: #2E1A1A;
  --amber: #FBBF24; --amber-soft: #2A2110;
  --code-bg: #0A0C12; --side: #121318;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui,
       sans-serif; background: var(--bg); color: var(--text); font-size: 14px;
       -webkit-font-smoothing: antialiased; }
button { font-family: inherit; }
.num { font-variant-numeric: tabular-nums; }
.cap { font-size: 11px; color: var(--muted); letter-spacing: .08em; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); }
                    to { opacity: 1; transform: none; } }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 35%,
                      transparent); }
                   70% { box-shadow: 0 0 0 9px transparent; } 100% {
                      box-shadow: 0 0 0 0 transparent; } }
@keyframes shimmer { 0% { background-position: -300px 0; }
                     100% { background-position: 300px 0; } }

/* ═══ 框架 ═══ */
.shell { display: flex; height: 100vh; }
.side { width: 208px; background: var(--side); border-right: 1px solid var(--line);
        display: flex; flex-direction: column; padding: 18px 12px; flex-shrink: 0; }
.brand { display: flex; gap: 10px; align-items: center; padding: 2px 10px 20px; }
.brand .mark { width: 26px; height: 26px; border-radius: 8px; background:
               var(--accent); color: white; display: flex; align-items: center;
               justify-content: center; font-size: 12px; font-weight: 700; }
.brand b { font-size: 12.5px; line-height: 1.3; font-weight: 600; }
.nav { padding: 9px 12px; border-radius: 9px; cursor: pointer; color: var(--muted);
       font-size: 13px; position: relative; transition: .15s; }
.nav:hover { background: var(--bg); color: var(--text); }
.nav.active { color: var(--text); font-weight: 600; background: var(--bg); }
.nav.active::before { content: ""; position: absolute; left: 0; top: 9px;
                      bottom: 9px; width: 2.5px; border-radius: 2px;
                      background: var(--accent); }
.side .spacer { flex: 1; }
.sidefoot { padding: 10px 12px; border-top: 1px solid var(--line); font-size: 11.5px;
            color: var(--muted); display: flex; gap: 9px; align-items: center; }
.sidefoot .av { width: 26px; height: 26px; border-radius: 50%; background:
                var(--accent-soft); color: var(--accent); display: flex;
                align-items: center; justify-content: center; font-size: 11px; }

.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.topbar { display: flex; align-items: center; gap: 10px; padding: 14px 26px;
          justify-content: flex-end; }
.iconbtn { width: 32px; height: 32px; border-radius: 9px; border: 1px solid
           var(--line); background: var(--card); cursor: pointer; font-size: 13px;
           color: var(--muted); transition: .15s; }
.iconbtn:hover { color: var(--accent); border-color: var(--accent); }
.btn { padding: 8px 18px; border-radius: 9px; border: 0; cursor: pointer;
       font-size: 13px; background: var(--accent); color: white; transition: .15s; }
.btn:hover { filter: brightness(1.07); }
.btn.ghost { background: var(--card); color: var(--text); border: 1px solid
             var(--line2); }
.btn.ghost:hover { border-color: var(--muted); filter: none; }
.content { flex: 1; overflow-y: auto; padding: 4px 26px 40px; }
.view { display: none; } .view.on { display: block; animation: fadeUp .25s ease; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 13px;
        padding: 18px 20px; }

/* ═══ ① 开始页 ═══ */
.startwrap { max-width: 700px; margin: 6vh auto 0; }
.eyebrow { text-align: center; margin-bottom: 10px; }
.startwrap h1 { text-align: center; font-size: 24px; font-weight: 600;
                letter-spacing: -.01em; margin-bottom: 26px; }
.inputcard { border: 1px solid var(--line2); border-radius: 15px; background:
             var(--card); padding: 6px 6px 6px; transition: .2s; }
.inputcard:focus-within { border-color: var(--accent);
                          box-shadow: 0 0 0 3px var(--accent-soft); }
textarea { width: 100%; min-height: 92px; border: 0; padding: 14px 14px 8px;
           font-size: 14.5px; font-family: inherit; background: transparent;
           color: var(--text); resize: vertical; }
textarea:focus { outline: none; }
.chiprow { display: flex; flex-wrap: wrap; gap: 7px; padding: 4px 12px 12px; }
.chip { font-size: 12px; padding: 5px 13px; border-radius: 99px; border: 1px solid
        var(--line2); color: var(--muted); cursor: pointer; transition: .15s;
        background: transparent; }
.chip:hover { color: var(--text); border-color: var(--muted); }
.chip.sel { background: var(--accent-soft); color: var(--accent);
            border-color: var(--accent); }
.subrow { display: flex; align-items: center; justify-content: space-between;
          padding: 10px 14px; border-top: 1px solid var(--line); }
.opt { display: flex; gap: 6px; align-items: center; font-size: 12.5px;
       color: var(--muted); cursor: pointer; user-select: none; }
.statline { display: flex; justify-content: center; gap: 26px; padding: 18px 0;
            color: var(--muted); font-size: 12.5px; flex-wrap: wrap; }
.statline b { color: var(--text); font-weight: 600; margin-right: 5px; }
.recentbox { margin-top: 10px; }
.ri { display: flex; gap: 10px; align-items: center; padding: 11px 6px;
      border-bottom: 1px solid var(--line); font-size: 13px; cursor: pointer;
      color: var(--text); transition: .15s; }
.ri:last-child { border-bottom: 0; }
.ri:hover { color: var(--accent); }
.ri .rg { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ri .rt { font-size: 11px; color: var(--faint); white-space: nowrap; }
.sdot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.sdot.done { background: var(--green); } .sdot.run { background: var(--accent); }
.sdot.part { background: var(--amber); }

/* ═══ ② 运行页 ═══ */
.runhead { display: flex; align-items: center; gap: 12px; margin: 8px 0 18px;
           max-width: 1060px; margin-left: auto; margin-right: auto; }
.runhead .ttl { font-size: 15.5px; font-weight: 600; flex: 1; white-space: nowrap;
                overflow: hidden; text-overflow: ellipsis; }
.statepill { display: flex; gap: 7px; align-items: center; font-size: 12.5px;
             color: var(--muted); white-space: nowrap; }
.statepill .sdot.run { animation: pulse 1.8s infinite; }

/* 管线条（事件驱动） */
.pipe { display: flex; align-items: flex-start; max-width: 1060px; margin: 0 auto
        22px; padding: 16px 18px; }
.pnode { display: flex; flex-direction: column; align-items: center; gap: 7px;
         width: 74px; flex-shrink: 0; }
.pd { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid
      var(--line2); background: var(--card); display: flex; align-items: center;
      justify-content: center; font-size: 10px; color: var(--faint); transition:
      .3s; }
.pnode.done .pd { background: var(--text); border-color: var(--text); color:
                  var(--card); }
.pnode.active .pd { border-color: var(--accent); color: var(--accent);
                    animation: pulse 1.8s infinite; }
.pnode.fail .pd { border-color: var(--red); color: var(--red); }
.plabel { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.pnode.done .plabel, .pnode.active .plabel { color: var(--text); }
.pcount { font-size: 10px; color: var(--accent); }
.pline { flex: 1; height: 1.5px; background: var(--line2); margin-top: 11px;
         min-width: 12px; }
.pline.fill { background: var(--text); }

.rungrid { display: grid; grid-template-columns: 1fr 320px; gap: 18px;
           max-width: 1060px; margin: 0 auto; align-items: start; }
.rightcol { position: sticky; top: 4px; display: flex; flex-direction: column;
            gap: 14px; }

/* 纵向活动流 */
.flow { position: relative; padding-left: 22px; }
.flow::before { content: ""; position: absolute; left: 6px; top: 8px; bottom: 8px;
                width: 1.5px; background: var(--line); }
.fitem { position: relative; margin-bottom: 12px; animation: fadeUp .3s ease; }
.fitem::before { content: ""; position: absolute; left: -20px; top: 15px; width: 9px;
                 height: 9px; border-radius: 50%; background: var(--card); border:
                 2px solid var(--faint); }
.fitem.ok::before { border-color: var(--green); background: var(--green); }
.fitem.err::before { border-color: var(--red); background: var(--red); }
.fitem.run::before { border-color: var(--accent); animation: pulse 1.8s infinite; }
.fcard { background: var(--card); border: 1px solid var(--line); border-radius:
         12px; overflow: hidden; }
.fhead { display: flex; gap: 10px; align-items: center; padding: 11px 14px;
         font-size: 13px; }
.fhead b { font-weight: 600; }
.fhead .tid { color: var(--faint); font-size: 11px; }
.fhead .tms { margin-left: auto; color: var(--muted); font-size: 11.5px; }
.fbody { padding: 0 14px 12px; font-size: 12.5px; color: var(--muted);
         line-height: 1.65; max-height: 44px; overflow: hidden; cursor: pointer;
         transition: .25s; white-space: pre-wrap; word-break: break-all; }
.fbody.open { max-height: 340px; overflow-y: auto; color: var(--text); }
.ferr { padding: 0 14px 12px; font-size: 12.5px; color: var(--red);
        line-height: 1.6; }
.fitem.run .fbody { color: var(--text); }
.shimline { height: 10px; border-radius: 5px; margin: 4px 14px 12px;
            background: linear-gradient(90deg, var(--bg) 25%, var(--line) 50%,
            var(--bg) 75%); background-size: 600px 100%; animation: shimmer
            1.5s infinite linear; }
.replanrow { display: flex; gap: 10px; align-items: center; padding: 9px 14px;
             background: var(--amber-soft); border: 1px solid color-mix(in srgb,
             var(--amber) 30%, transparent); border-radius: 10px; font-size:
             12.5px; color: var(--amber); }
.replanrow::before { background: var(--amber); border-color: var(--amber); }

/* HITL */
.hitl { border: 1px solid color-mix(in srgb, var(--amber) 45%, transparent);
        background: var(--amber-soft); border-radius: 12px; padding: 15px 16px; }
.hitl .cap { color: var(--amber); margin-bottom: 8px; }
.hitl .code { font-family: Consolas, monospace; background: var(--card);
              border-radius: 9px; padding: 10px 12px; margin-bottom: 11px;
              font-size: 12px; max-height: 150px; overflow: auto;
              white-space: pre-wrap; }
.hitl .btns { display: flex; gap: 9px; }
.hitl button { flex: 1; padding: 9px; border-radius: 9px; border: 0; cursor:
               pointer; font-size: 13px; transition: .15s; }
.hitl .yes { background: var(--accent); color: white; }
.hitl .no { background: var(--card); color: var(--text); border: 1px solid
            var(--line2); }

/* 右列 */
.progcard .cap { margin-bottom: 10px; }
.bigpct { display: flex; justify-content: space-between; align-items: baseline;
          margin-bottom: 9px; }
.bigpct b { font-size: 22px; font-weight: 650; }
.bigpct span { font-size: 12px; color: var(--muted); }
.prog { height: 5px; border-radius: 5px; background: var(--bg); overflow: hidden;
        border: 1px solid var(--line); }
.prog i { display: block; height: 100%; width: 0; border-radius: 5px; background:
          var(--accent); transition: width .6s cubic-bezier(.22,1,.36,1); }
.obsblk { background: var(--code-bg); color: var(--code-tx); border-radius: 11px;
          padding: 13px 15px; font-family: Consolas, monospace; font-size: 11.5px;
          line-height: 1.7; white-space: pre-wrap; max-height: 220px; overflow-y:
          auto; word-break: break-all; }
.evalrow { font-size: 12px; color: var(--muted); line-height: 1.6;
           padding-top: 10px; border-top: 1px solid var(--line); margin-top: 12px; }
.evalrow b { color: var(--text); }

/* ═══ ③ 结束页 ═══ */
.donewrap { max-width: 820px; margin: 0 auto; }
.donehead { display: flex; gap: 14px; align-items: center; padding: 20px;
            margin-bottom: 16px; }
.donehead .emo { width: 44px; height: 44px; border-radius: 50%; background:
                 var(--green-soft); color: var(--green); display: flex;
                 align-items: center; justify-content: center; font-size: 19px; }
.donehead h2 { font-size: 17px; font-weight: 650; }
.donehead .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
.stat4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
         margin-bottom: 16px; }
.st { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
     padding: 15px 8px; text-align: center; }
.st .n { font-size: 20px; font-weight: 650; letter-spacing: -.01em; }
.st .l { font-size: 11px; color: var(--muted); margin-top: 5px; }
.doneres { max-height: 480px; overflow-y: auto; }
.doneres .cap { margin-bottom: 12px; }
.doneres .cap button { float: right; font-size: 11px; color: var(--accent);
  background: none; border: 0; cursor: pointer; padding: 0; }
.md p { margin: 0 0 10px; line-height: 1.8; font-size: 13.5px; }
.md h3 { margin: 14px 0 8px; font-size: 14.5px; }
.md ul { margin: 0 0 10px 18px; } .md li { margin-bottom: 5px; font-size: 13.5px;
         line-height: 1.7; }
.md a { color: var(--accent); }
.donegrid2 { display: grid; grid-template-columns: 1fr 300px; gap: 16px;
             align-items: start; }
.donut { width: 128px; height: 128px; border-radius: 50%; margin: 8px auto 14px; }
.donut::after { content: attr(data-center); display: flex; align-items: center;
                justify-content: center; text-align: center; font-size: 10.5px;
                font-weight: 650; color: var(--text); width: 86px; height: 86px;
                border-radius: 50%; background: var(--card); margin: 21px auto 0;
                line-height: 1.5; }
.leg { display: flex; justify-content: space-between; font-size: 12px; padding:
       5px 2px; color: var(--muted); }
.leg .sw { width: 8px; height: 8px; border-radius: 3px; display: inline-block;
           margin-right: 7px; vertical-align: 0; }
.nexts .nx { display: flex; gap: 10px; align-items: center; padding: 11px;
             border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px;
             cursor: pointer; font-size: 13px; transition: .15s; }
.nexts .nx:hover { border-color: var(--accent); }
.nexts .nx .v2 { margin-left: auto; font-size: 10px; color: var(--faint);
                 border: 1px solid var(--line2); border-radius: 5px; padding: 1px
                 6px; }
.nexts .nx .d { font-size: 11px; color: var(--muted); margin-top: 2px; }

#toasts { position: fixed; top: 18px; right: 18px; z-index: 60; display: flex;
          flex-direction: column; gap: 8px; }
.toast { background: var(--text); color: var(--bg); border-radius: 10px; padding:
         11px 17px; font-size: 12.5px; box-shadow: 0 8px 24px rgba(0,0,0,.14);
         animation: fadeUp .25s ease; max-width: 300px; }
.toast.warn { color: var(--amber); } .toast.ok { color: var(--green); }
@media (max-width: 900px) { .rungrid, .donegrid2 { grid-template-columns: 1fr; }
  .rightcol { position: static; } .side { display: none; } }
</style>
</head>
<body>
<div id="toasts"></div>
<div class="shell">
  <aside class="side">
    <div class="brand"><div class="mark">A</div>
      <b>Adaptive Task<br>Planning Agent</b></div>
    <div class="nav active" data-nav="start">首页</div>
    <div class="nav" onclick="toast('任务记录保存在浏览器本地')">任务列表</div>
    <div class="nav" onclick="toast('data/knowledge 笔记语料')">知识库</div>
    <div class="nav" onclick="toast('memory.sqlite')">记忆中心</div>
    <div class="nav" onclick="toast('7 个工具已注册')">工具</div>
    <div class="nav" onclick="toast('V2 规划')">设置</div>
    <div class="spacer"></div>
    <div class="sidefoot"><div class="av">U</div><div>User<br>
      <span style="font-size:10px;color:var(--faint)">本地会话</span></div></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="iconbtn" id="themeBtn" title="切换主题">☾</button>
      <button class="btn ghost" id="newBtn">新建任务</button>
    </div>

    <div class="content">
      <!-- ① 开始 -->
      <div class="view on" id="v-start">
        <div class="startwrap">
          <div class="eyebrow cap">ADAPTIVE · PLAN · EXECUTE · EVALUATE</div>
          <h1>今天要完成什么任务？</h1>
          <div class="inputcard">
            <textarea id="goal" placeholder="描述你的目标，例如：分析 langchain-ai/langgraph 的架构与核心模块……&#10;（Ctrl+Enter 发送）"></textarea>
            <div class="chiprow">
              <span class="chip sel" data-ex="分析 langchain-ai/langgraph 的架构与核心模块">GitHub 项目分析</span>
              <span class="chip" data-ex="为我规划一份 Rust 入门学习路径，并推荐资料">学习路径规划</span>
              <span class="chip" data-ex="排查：FastAPI 服务启动报 ModuleNotFoundError 该如何定位">技术问题排查</span>
              <span class="chip" data-ex="">自定义</span>
            </div>
            <div class="subrow">
              <label class="opt"><input type="checkbox" id="adaptive" checked>
                自适应重规划</label>
              <button class="btn" id="start">开始 →</button>
            </div>
          </div>
          <div class="statline" id="statline">
            <span><b class="num">–</b>工具</span><span><b class="num">–</b>知识文档</span>
            <span><b class="num">–</b>记忆条目</span><span><b class="num">–</b>次运行</span>
          </div>
          <div class="card recentbox">
            <div class="cap" style="margin:0 6px 4px">最近任务</div>
            <div id="recentList"></div>
          </div>
        </div>
      </div>

      <!-- ② 运行 -->
      <div class="view" id="v-run">
        <div class="runhead">
          <button class="btn ghost" onclick="backStart()">←</button>
          <div class="ttl" id="runTitle"></div>
          <div class="statepill"><span class="sdot run" id="runDot"></span>
            <span id="runState">连接中</span></div>
        </div>
        <div class="card pipe" id="pipe"></div>
        <div class="rungrid">
          <div class="flow" id="flow"></div>
          <div class="rightcol">
            <div class="card progcard">
              <div class="cap">任务进度</div>
              <div class="bigpct"><b class="num" id="pctTxt">0%</b>
                <span class="num" id="fracTxt">0 / 0 子任务</span></div>
              <div class="prog"><i id="progBar"></i></div>
            </div>
            <div class="card">
              <div class="cap" style="margin-bottom:10px">最新观察回执</div>
              <div class="obsblk" id="obsCode">等待第一个观察…</div>
              <div class="evalrow" id="evalRow" style="display:none"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- ③ 结束 -->
      <div class="view" id="v-done">
        <div class="donewrap">
          <div class="runhead" style="margin-left:0;margin-right:0;max-width:none">
            <button class="btn ghost" onclick="backStart()">←</button>
            <div class="ttl" id="doneTitle"></div>
            <button class="btn ghost" id="copyBtn" style="padding:8px 12px">复制</button>
            <button class="btn" id="dlBtn" style="padding:8px 12px">下载报告</button>
          </div>
          <div class="donegrid2">
            <div>
              <div class="card donehead">
                <div class="emo" id="doneEmo">✓</div>
                <div><h2 id="doneHead">任务执行完成</h2>
                  <div class="sub" id="doneSub"></div></div>
              </div>
              <div class="stat4" id="stat4"></div>
              <div class="card pipe" id="pipe2" style="margin-bottom:16px"></div>
              <div class="card doneres">
                <div class="cap">结果<button id="expandMd">展开全部</button></div>
                <div class="md" id="doneMd"></div>
              </div>
            </div>
            <div class="rightcol" style="position:static">
              <div class="card">
                <div class="cap">工具使用</div>
                <div class="donut" id="donut" data-center=""></div>
                <div id="legend"></div>
              </div>
              <div class="card nexts">
                <div class="cap" style="margin-bottom:10px">下一步</div>
                <div class="nx" onclick="continueAsk()"><div><b>继续追问</b>
                  <div class="d">基于本次结果深入</div></div></div>
                <div class="nx" onclick="toast('V2：接入知识库写入端点','warn')">
                  <div><b>存入知识库</b><div class="d">摘要写入笔记库</div></div>
                  <span class="v2">V2</span></div>
                <div class="nx" onclick="toast('V2：接入记忆端点','warn')">
                  <div><b>写入记忆</b><div class="d">长期记忆条目</div></div>
                  <span class="v2">V2</span></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let runId = null, es = null, snap = { state: {} }, finalText = "";
let seenKeys = new Set(), lastReplan = 0;
let nodeCounts = {};          // 节点 → 触发次数（事件驱动，真实轮次）
let curNode = null, finished = false, failed = false;
let pendingCard = null;

/* ── 主题 ── */
$("themeBtn").onclick = () => {
  const h = document.documentElement, dark = h.dataset.theme === "dark";
  h.dataset.theme = dark ? "light" : "dark";
  $("themeBtn").textContent = dark ? "☾" : "☀";
};

/* ── 视图 ── */
function show(id) {
  document.querySelectorAll(".view").forEach(v => v.classList.remove("on"));
  $(id).classList.add("on");
  document.querySelector('[data-nav="start"]').classList.toggle("active",
    id === "v-start");
  document.querySelector(".content").scrollTop = 0;
}
function backStart() { if (es) es.close(); show("v-start");
  loadStats(); renderRecent(); }
$("newBtn").onclick = () => { backStart(); $("goal").value = ""; $("goal").focus(); };

/* ── Toast ── */
function toast(msg, cls = "") {
  const t = document.createElement("div");
  t.className = "toast " + cls; t.textContent = msg;
  $("toasts").appendChild(t); setTimeout(() => t.remove(), 3200);
}

/* ── 任务类型 chip（预填示例，真实可用） ── */
document.querySelectorAll(".chip").forEach(c => c.onclick = () => {
  document.querySelectorAll(".chip").forEach(x => x.classList.remove("sel"));
  c.classList.add("sel");
  if (c.dataset.ex) { $("goal").value = c.dataset.ex; }
});

/* ── 真实统计 ── */
async function loadStats() {
  try {
    const s = await (await fetch("/api/stats")).json();
    const b = $("statline").querySelectorAll("b");
    [s.tools, s.knowledge_docs, s.memories, s.runs].forEach((v, i) =>
      b[i].textContent = v + " ");
  } catch {}
}

/* ── 最近任务 ── */
function getRuns() { return JSON.parse(localStorage.getItem("runs2") || "[]"); }
function setRuns(l) { localStorage.setItem("runs2", JSON.stringify(l.slice(0, 8))); }
function saveRun(goal, rid) {
  const l = getRuns().filter(x => x.rid !== rid);
  l.unshift({ goal, rid, status: "run", time: new Date().toLocaleString("zh",
    { hour12: false }) });
  setRuns(l); renderRecent();
}
function finishRun(rid, ok) {
  const l = getRuns(); const it = l.find(x => x.rid === rid);
  if (it) { it.status = ok ? "done" : "part"; setRuns(l); }
}
function renderRecent() {
  const box = $("recentList"); box.innerHTML = "";
  const l = getRuns();
  if (!l.length) { box.innerHTML = `<div style="color:var(--faint);
    font-size:12px;padding:10px 6px">还没有运行记录</div>`; return; }
  l.forEach(x => {
    const d = document.createElement("div"); d.className = "ri";
    d.innerHTML = `<span class="sdot ${x.status}"></span><span class="rg"></span>
      <span class="rt">${x.time.slice(5)}</span>`;
    d.querySelector(".rg").textContent = x.goal.slice(0, 30);
    d.onclick = () => { $("goal").value = x.goal; $("goal").focus(); };
    box.appendChild(d);
  });
}

/* ── 管线条：状态完全由事件/快照推导 ── */
const PIPE = [
  { k: "planner", label: "规划" },
  { k: "executor", label: "执行" },
  { k: "evaluator", label: "评估" },
  { k: "replanner", label: "重规划" },
  { k: "final", label: "完成" },
];
function renderPipe(el) {
  const visited = k => (nodeCounts[k] || 0) > 0;
  const nodes = PIPE.map(p => {
    let cls = "", extra = "";
    if (p.k === "final") {
      if (failed) cls = "fail";
      else if (finished) cls = "done";
      else if (curNode === "final_answer") cls = "active";
    } else if (p.k === "replanner") {
      const n = nodeCounts.replanner || 0;
      if (n > 0) { cls = "done"; extra = `×${n}`; }
      else if (curNode === "replanner") cls = "active";
      else if (finished && !failed) { cls = "done"; extra = "0"; }
    } else {
      if (curNode === p.k && !finished) cls = "active";
      else if (visited(p.k)) cls = "done";
      const n = nodeCounts[p.k] || 0;
      if ((p.k === "executor" || p.k === "evaluator") && n > 1) extra = `×${n}`;
    }
    return { k: p.k, label: p.label, cls, extra };
  });
  // 连接线：下一个节点被访问过或已结束则填充
  el.innerHTML = nodes.map((n, i) => {
    const nx = nodes[i + 1];
    const fill = !nx ? "" : `<div class="pline ${visited(nx.k) || finished ||
      (curNode === nx.k && !failed) ? "fill" : ""}"></div>`;
    return `<div class="pnode ${n.cls}"><div class="pd">${
      n.cls === "done" ? "✓" : n.cls === "fail" ? "✕" : ""}</div>
      <div class="plabel">${n.label}${n.extra ?
        ` <span class="pcount num">${n.extra}</span>` : ""}</div></div>${fill}`;
  }).join("");
}
function setRunState(txt, mode) {
  $("runState").textContent = txt;
  $("runDot").className = "sdot " + mode;
}

/* ── 活动流 ── */
function flowAppend(html, cls = "") {
  const d = document.createElement("div");
  d.className = "fitem " + cls; d.innerHTML = html;
  const c = document.querySelector(".content");
  const stick = c.scrollHeight - c.scrollTop - c.clientHeight < 160;
  $("flow").appendChild(d);
  if (stick) c.scrollTop = c.scrollHeight;
  return d;
}
function addPending(desc) {
  removePending();
  pendingCard = flowAppend(
    `<div class="fcard"><div class="fhead"><b>执行中</b>
     <span class="tid">${desc || ""}</span></div>
     <div class="shimline"></div><div class="shimline"
     style="width:62%"></div></div>`, "run");
}
function removePending() {
  if (pendingCard) { pendingCard.remove(); pendingCard = null; }
}
function addObsCard(o) {
  removePending();
  const d = flowAppend(
    `<div class="fcard"><div class="fhead"><b>${o.tool}</b>
     <span class="tid">${o.task_id}</span>
     <span class="tms num">${o.latency_ms}ms · ${o.success ? "成功" :
      "失败"}</span></div>
     ${o.success
       ? `<div class="fbody">${esc(o.summary || "（无摘要）")}</div>`
       : `<div class="ferr">${esc(o.error || "未知错误")}</div>`}</div>`,
    o.success ? "ok" : "err");
  const body = d.querySelector(".fbody");
  if (body) body.onclick = () => body.classList.toggle("open");
}
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
  .replace(/>/g, "&gt;"); }

/* ── 启动 ── */
$("start").onclick = start;
$("goal").addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) start(); });
async function start() {
  const g = $("goal").value.trim();
  if (!g) { $("goal").focus(); return; }
  show("v-run");
  $("runTitle").textContent = g;
  seenKeys = new Set(); lastReplan = 0; nodeCounts = {}; curNode = null;
  finished = false; failed = false; finalText = ""; pendingCard = null;
  $("flow").innerHTML = ""; $("obsCode").textContent = "等待第一个观察…";
  $("evalRow").style.display = "none";
  $("progBar").style.width = "0"; $("pctTxt").textContent = "0%";
  $("fracTxt").textContent = "0 / 0 子任务";
  setRunState("创建中…", "run"); renderPipe($("pipe"));

  const r = await fetch("/api/runs", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ goal: g, adaptive: $("adaptive").checked })
  }).then(x => x.json());
  runId = r.run_id; saveRun(g, runId);

  es = new EventSource(`/api/runs/${runId}/events`);
  es.addEventListener("node_update", e => {
    const node = JSON.parse(e.data).node;
    nodeCounts[node] = (nodeCounts[node] || 0) + 1;
    curNode = node;
    const zh = { planner: "规划中", executor: "执行中", evaluator: "评估中",
      replanner: "重规划中", final_answer: "汇总中", human_gate: "等待审批" }[node]
      || node;
    setRunState(zh, "run"); renderPipe($("pipe"));
    if (node === "executor") {
      const st = snap.state || {};
      const t = (st.plan || [])[st.current_task ?? -1];
      addPending(t ? `${t.id} ${t.description.slice(0, 40)}` : "");
    } else removePending();
    if (node === "replanner") flowAppend(
      `<div class="replanrow">↺ 第${nodeCounts.replanner}次重规划 ·
       保留已完成任务，针对缺口调整</div>`, "");
    refresh();
  });
  es.addEventListener("hitl_request", e => {
    const d = JSON.parse(e.data);
    flowAppend(`<div class="hitl"><div class="cap">⛔ 高危操作 · 等待人工审批</div>
      <div class="code">${esc(d.code || "（见任务描述）")}</div>
      <div class="btns"><button class="yes" onclick="decide(true)">批准执行</button>
      <button class="no" onclick="decide(false)">拒绝</button></div></div>`, "run");
    setRunState("等待审批", "run");
  });
  es.addEventListener("hitl_resolved", e => {
    const ok = JSON.parse(e.data).approved;
    const cards = document.querySelectorAll(".hitl");
    if (cards.length) cards[cards.length - 1].innerHTML =
      `<div class="cap">${ok ? "✓ 已批准，继续执行" :
      "✕ 已拒绝（否决即终审）"}</div>`;
  });
  es.addEventListener("final", e => { es.close(); finished = true; curNode = null;
    setTimeout(() => refresh().then(() => finish(JSON.parse(e.data))), 400); });
  es.addEventListener("error", () => { if (!finished) refresh(); });
}

/* ── 快照 ── */
async function refresh() {
  if (!runId) return;
  const r = await fetch(`/api/runs/${runId}`);
  if (!r.ok) return;
  snap = await r.json();
  const st = snap.state || {};
  (st.observations || []).forEach(o => {
    const k = o.task_id + o.tool + (o.summary || o.error || "").slice(0, 40) +
      o.latency_ms;
    if (seenKeys.has(k)) return;
    seenKeys.add(k);
    addObsCard(o);
    $("obsCode").textContent = (o.success ? (o.summary || "") :
      "错误：" + (o.error || "")).slice(0, 900);
  });
  lastReplan = st.replan_count || lastReplan;
  const ev = st.evaluation;
  if (ev && ev.reason) {
    $("evalRow").style.display = "";
    $("evalRow").innerHTML = `最近评估：<b>${esc(ev.reason.slice(0, 120))}</b>` +
      (ev.missing_info ? `<br>缺口：${esc(ev.missing_info.slice(0, 100))}` : "");
  }
  const plan = st.plan || [];
  const doneN = plan.filter(t => t.status === "completed").length;
  const pct = plan.length ? Math.round(doneN / plan.length * 100) : 0;
  $("progBar").style.width = (finished ? Math.max(pct, 100) : pct) + "%";
  $("pctTxt").textContent = (finished ? 100 : pct) + "%";
  $("fracTxt").textContent = `${doneN} / ${plan.length} 子任务`;
  renderPipe($("pipe"));
}

/* ── 数字滚动 ── */
function countUp(el, val, dur = 700) {
  if (typeof val !== "number") { el.textContent = val; return; }
  const t0 = performance.now();
  (function f(t) {
    const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(val * e) + (p === 1 ? "" : "");
    if (p < 1) requestAnimationFrame(f); else el.textContent = val;
  })(t0);
}

/* ── 结束页（时间线数据驱动，不再硬编码） ── */
function finish(answer) {
  finalText = answer || "";
  const ok = !failed;
  finishRun(runId, ok);
  const st = snap.state || {};
  const obs = st.observations || [];
  const plan = st.plan || [];
  const doneN = plan.filter(t => t.status === "completed").length;
  const all = plan.length > 0 && doneN === plan.length;
  const okN = obs.filter(o => o.success).length;
  const latency = obs.reduce((s, o) => s + (o.latency_ms || 0), 0);

  $("doneEmo").textContent = ok ? (all ? "✓" : "◐") : "✕";
  $("doneEmo").style.background = ok ? "var(--green-soft)" : "var(--red-soft)";
  $("doneEmo").style.color = ok ? "var(--green)" : "var(--red)";
  $("doneHead").textContent = !ok ? "任务出错" :
    all ? "任务执行完成" : "任务结束 · 部分完成";
  $("doneTitle").textContent = $("runTitle").textContent;
  const rp = nodeCounts.replanner || 0;
  $("doneSub").textContent = `run_id ${runId} · 执行 ${nodeCounts.executor || 0} 轮
    · 重规划 ${rp} 次 · 工具耗时 ${(latency / 1000).toFixed(1)}s`;

  const st4 = [
    { v: plan.length ? doneN / plan.length : 0, txt: plan.length ?
      `${doneN}/${plan.length}` : "–", l: "子任务完成", n: true },
    { v: obs.length, txt: "", l: "工具调用" },
    { v: obs.length ? okN / obs.length : 0, txt: obs.length ?
      Math.round(okN / obs.length * 100) + "%" : "–", l: "调用成功率", n: true },
    { v: latency / 1000, txt: "", l: "工具耗时 (s)", dec: 1 },
  ];
  $("stat4").innerHTML = st4.map(() =>
    `<div class="st"><div class="n num"></div><div class="l"></div></div>`).join("");
  const cards = $("stat4").children;
  countUp(cards[0].querySelector(".n"), st4[0].v * 100);
  setTimeout(() => cards[0].querySelector(".n").textContent = st4[0].txt, 720);
  countUp(cards[1].querySelector(".n"), st4[1].v);
  countUp(cards[2].querySelector(".n"), st4[2].v * 100);
  setTimeout(() => cards[2].querySelector(".n").textContent = st4[2].txt, 720);
  cards[3].querySelector(".n").textContent = st4[3].v.toFixed(1);
  [...cards].forEach((c, i) => c.querySelector(".l").textContent = st4[i].l);

  // 结束页管线：真实发生过什么就显示什么
  renderPipe($("pipe2"));
  $("doneMd").innerHTML = md(finalText) ||
    `<p style="color:var(--muted)">（无最终答复）</p>`;
  $("expandMd").onclick = () => {
    const p = $("doneMd").parentElement;
    p.classList.toggle("doneres");
    p.style.maxHeight = "";
    $("expandMd").textContent = p.classList.contains("doneres") ?
      "展开全部" : "收起";
  };
  renderDonut(obs);
  show("v-done");
  toast(ok ? "任务完成" : "任务出错", ok ? "ok" : "warn");
}

/* ── 工具环形图（observations 聚合） ── */
function renderDonut(obs) {
  const cnt = {};
  obs.forEach(o => cnt[o.tool] = (cnt[o.tool] || 0) + 1);
  const entries = Object.entries(cnt).sort((a, b) => b[1] - a[1]).slice(0, 6);
  const colors = ["#4F46E5", "#16A34A", "#C77E0A", "#0EA5E9", "#EC4899",
                  "#14B8A6"];
  const total = obs.length || 1;
  let acc = 0; const segs = [];
  entries.forEach(([name, n], i) => {
    const a0 = acc / total * 360; acc += n; const a1 = acc / total * 360;
    segs.push(`${colors[i]} ${a0}deg ${a1}deg`);
  });
  $("donut").style.background = `conic-gradient(${segs.join(",")})`;
  $("donut").dataset.center = `${total} 次<br>调用`;
  $("legend").innerHTML = entries.map(([name, n], i) =>
    `<div class="leg"><span><span class="sw"
      style="background:${colors[i]}"></span>${name}</span>
      <span class="num">${n} · ${Math.round(n / total * 100)}%</span></div>`
  ).join("") || `<div class="leg">无调用</div>`;
}

/* ── md ── */
function md(text) {
  if (!text) return "";
  const esc2 = esc(text);
  let html = "", inList = false;
  for (const ln0 of esc2.split(/\r?\n/)) {
    const t = ln0.trim();
    if (/^[-*]\s+/.test(t)) {
      if (!inList) { html += "<ul>"; inList = true; }
      html += "<li>" + inline(t.replace(/^[-*]\s+/, "")) + "</li>";
    } else {
      if (inList) { html += "</ul>"; inList = false; }
      if (/^#{1,4}\s/.test(t)) html += `<h3>${inline(t.replace(/^#{1,4}\s/, ""))}</h3>`;
      else if (t) html += `<p>${inline(t)}</p>`;
    }
  }
  return html + (inList ? "</ul>" : "");
  function inline(s) {
    return s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
      .replace(/(https?:\/\/[^\s<)]+)/g, '<a href="$1" target="_blank">$1</a>');
  }
}

/* ── 操作 ── */
function decide(approved) {
  fetch(`/api/runs/${runId}/approvals`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ approved })
  });
}
function continueAsk() {
  backStart(); $("goal").value = "基于上一个任务的结果，继续深入：";
  $("goal").focus();
}
$("copyBtn").onclick = () => {
  navigator.clipboard.writeText(finalText).then(() => toast("已复制", "ok"),
    () => toast("复制失败"));
};
$("dlBtn").onclick = () => {
  fetch(`/api/runs/${runId}`).then(r => r.json()).then(s => {
    const blob = new Blob([JSON.stringify(s, null, 1)],
      { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `report-${runId}.json`;
    a.click();
  });
};

loadStats(); renderRecent();
</script>
</body>
</html>
