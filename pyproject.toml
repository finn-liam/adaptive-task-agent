[project]
name = "adaptive-task-agent"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "ddgs>=9.16.0",
    "httpx>=0.28.1",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "lxml>=6.1.2",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.16.4",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
